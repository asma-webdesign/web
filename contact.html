<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Asma Web Design</title>
  <meta name="description" content="Get in touch with Asma Web Design for your website project. Fill the form to start your project.">
  <meta property="og:title" content="Asma Web Design - Contact">
  <meta property="og:description" content="Contact Asma Web Design to build your professional website.">
  <meta property="og:image" content="images/contact.jpg">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
<header>
  <div class="container header-container">
    <div class="logo">Asma Web Design</div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="portfolio.html">Portfolio</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
      <div class="hamburger">
        <i class="fas fa-bars"></i>
      </div>
    </nav>
  </div>
</header>

<section class="contact-page">
  <div class="container">
    <h1>Contact Us</h1>
    <p>Fill out the form below to start your website project. We'll get back to you within 24 hours.</p>

    <form action="mailto:info@asmawebdesign.com" method="POST" enctype="text/plain">
      <div class="form-group">
        <label for="name">Name*</label>
        <input type="text" id="name" name="name" required placeholder="Your Name">
      </div>

      <div class="form-group">
        <label for="email">Email*</label>
        <input type="email" id="email" name="email" required placeholder="Your Email">
      </div>

      <div class="form-group">
        <label for="business">Business Type</label>
        <input type="text" id="business" name="business" placeholder="Salon, Restaurant, Clinic, etc.">
      </div>

      <div class="form-group">
        <label for="description">Project Description</label>
        <textarea id="description" name="description" placeholder="Describe your project"></textarea>
      </div>

      <div class="form-group">
        <label for="colors">Preferred Colors</label>
        <input type="text" id="colors" name="colors" placeholder="Example: Blue, Green, White">
      </div>

      <div class="form-group">
        <label for="examples">Website Examples/Links</label>
        <input type="text" id="examples" name="examples" placeholder="Provide links if any">
      </div>

      <button type="submit" class="btn btn-primary">Send Message</button>
    </form>
  </div>
</section>

<footer>
  <div class="container footer-container">
    <p>&copy; 2026 Asma Web Design</p>
    <p>Email: info@asmawebdesign.com | Follow us: 
      <a href="#"><i class="fab fa-facebook"></i></a>

      <a href="#"><i class="fab fa-linkedin"></i></a>
    </p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
