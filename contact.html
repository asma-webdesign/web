<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Asma Web Design</title>
    <meta name="description" content="Get in touch with Asma Web Design to start your project. Fill out the contact form.">
    <meta property="og:title" content="Asma Web Design - Contact">
    <meta property="og:description" content="Contact Asma Web Design to start your website project.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1498050108023-c5249f4df085?auto=format&fit=crop&w=1200&q=80">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
<header>
    <div class="container header-container">
        <div class="logo">Asma Web Design</div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
            <div class="hamburger">
                <i class="fas fa-bars"></i>
            </div>
        </nav>
    </div>
</header>

<section class="contact">
    <div class="container">
        <h1>Contact Us</h1>
        <form action="mailto:info@asmawebdesign.com" method="post" enctype="text/plain">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="business">Business Type</label>
            <input type="text" id="business" name="business" placeholder="e.g., Salon, Clinic">

            <label for="description">Project Description</label>
            <textarea id="description" name="description" rows="4" placeholder="Describe your project"></textarea>

            <label for="colors">Preferred Colors</label>
            <input type="text" id="colors" name="colors" placeholder="e.g., Blue & White">

            <label for="examples">Website Examples / Links</label>
            <input type="text" id="examples" name="examples" placeholder="Optional links">

            <button type="submit">Send Message</button>
        </form>
    </div>
</section>

<footer>
    <div class="container footer-container">
        <p>&copy; 2026 Asma Web Design</p>
        <p>Email: info@asmawebdesign.com | Follow us: 
            <a href="#"><i class="fab fa-facebook"></i></a> 
            <a href="#"><i class="fab fa-instagram"></i></a> 
            <a href="#"><i class="fab fa-linkedin"></i></a>
        </p>
    </div>
</footer>

<script src="script.js"></script>
</body>
</html>
